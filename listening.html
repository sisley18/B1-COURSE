<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening | English Language Course</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Accordion Styles */
        details {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        details[open] {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
        }

        summary {
            padding: 20px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            list-style: none;
            color: var(--text-secondary);
        }

        summary:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        summary::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--accent-gold);
            transition: transform 0.3s;
        }

        details[open] summary::after {
            content: '-';
            transform: rotate(0deg);
        }

        details[open] summary {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--accent-gold);
        }

        /* Content Styles */
        .unit-content {
            padding: 30px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 50px;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-gold);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .transcript-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            border-left: 3px solid var(--accent-gold);
        }

        .transcript-box.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .meta-tag {
            background: rgba(34, 211, 238, 0.1);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">English<span>Language</span></div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Listening</a></li>
                    <li><a href="reading.html">Reading</a></li>
                    <li><a href="grammar.html">Grammar</a></li>
                    <li><a href="collocations.html">Collocations</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container" style="padding-top: 120px; padding-bottom: 60px;">
        <h1 class="section-title">Listening Comprehension</h1>
        <p style="text-align: center; margin-bottom: 40px; color: var(--text-secondary);">Click a Unit to open the
            exercises.</p>

        <div id="listening-container"></div>
    </section>

    <footer>
        <div class="container">
            <p class="footer-credit">© 2024 English Language Course. Created by Cecilia Chiappero.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('listening-container');

            courseData.units.forEach(unit => {
                const item = unit.listening;
                const details = document.createElement('details');

                details.innerHTML = `
                    <summary>Unit ${unit.id}: ${unit.title} <span style="font-size:0.8rem; opacity:0.6; margin-left: 10px; font-weight: 400;">(${item.level})</span></summary>
                    <div class="unit-content">
                        <div style="display: flex; align-items: center; margin-bottom: 20px;">
                            <span class="meta-tag">Topic: ${unit.topic}</span>
                            <span class="meta-tag" style="background: rgba(244, 114, 182, 0.1); color: var(--accent-electric);">${item.gender.toUpperCase()} Voice</span>
                        </div>
                        <h3 style="margin-bottom: 15px;">${item.title}</h3>
                        
                        <div class="player-controls">
                            <button class="play-btn" onclick="playTrack('${item.transcript.replace(/'/g, "\\'")}', '${item.gender}')">▶</button>
                            <div style="flex-grow: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;">
                                <div style="width: 0%; height: 100%; background: var(--gradient-gold);"></div>
                            </div>
                            <span style="font-size: 0.9rem; opacity: 0.7;">TTS Audio</span>
                        </div>

                        <button class="btn btn-primary" style="padding: 8px 20px; font-size: 0.8rem; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold);" onclick="toggleTranscript(this)">Show Transcript</button>
                        
                        <div class="transcript-box">
                            <p>${item.transcript}</p>
                        </div>

                        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <h4 style="margin-bottom: 15px; color: var(--text-primary);">Comprehension Check</h4>
                            ${item.questions.map((q, idx) => `
                                <div style="margin-bottom: 15px;">
                                    <p style="margin-bottom: 10px; font-weight: 500;">${idx + 1}. ${q.q}</p>
                                    <div style="display: grid; gap: 10px; grid-template-columns: 1fr 1fr;">
                                        ${q.options.map((opt, i) => `
                                            <button class="btn" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); text-align: left; justify-content: flex-start;" 
                                            onclick="checkAnswer(this, ${i === q.correct})">${opt}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(details);
            });
        });

        window.playTrack = function (text, gender) { window.courseAudio.play(text, gender); };
        window.toggleTranscript = function (btn) {
            const box = btn.nextElementSibling;
            const isHidden = getComputedStyle(box).display === 'none';
            if (isHidden) { box.classList.add('visible'); btn.textContent = 'Hide Transcript'; }
            else { box.classList.remove('visible'); btn.textContent = 'Show Transcript'; }
        };
        window.checkAnswer = function (btn, isCorrect) {
            const parent = btn.parentElement;
            Array.from(parent.children).forEach(child => { child.style.background = 'rgba(255,255,255,0.05)'; child.style.borderColor = 'rgba(255,255,255,0.1)'; child.style.color = 'inherit'; });
            if (isCorrect) { btn.style.background = 'rgba(34, 211, 238, 0.2)'; btn.style.borderColor = '#22d3ee'; btn.style.color = '#fff'; }
            else { btn.style.background = 'rgba(255, 0, 0, 0.2)'; btn.style.borderColor = '#ff0000'; }
        };
    </script>
</body>

</html>
